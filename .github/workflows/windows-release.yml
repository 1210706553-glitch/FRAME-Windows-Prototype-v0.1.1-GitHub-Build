name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown in the update dialog
        required: false
        default: 修复问题并改进使用体验。

permissions:
  contents: write

jobs:
  publish-windows:
    name: Signed Windows NSIS Release
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing repository secret: TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing repository secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 张诗语の米奇妙妙工具 v__VERSION__
          releaseBody: ${{ inputs.release_notes }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
